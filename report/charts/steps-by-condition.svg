<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img">
<title>Steps per run</title>
<rect width="100%" height="100%" fill="#ffffff"/>
<style>
  text { font-family: ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif; fill: #1c1917; }
  .title { font-size: 16px; font-weight: 650; }
  .sub { font-size: 12px; fill: #57534e; }
  .tick { font-size: 11px; fill: #44403c; }
  .value { font-size: 11px; fill: #1c1917; }
  .note { font-size: 11px; fill: #57534e; }
</style>
<text class="title" x="24" y="28">Steps per run</text>
<text class="sub" x="24" y="48">Main phase. A CAP message and a page fetch are each one step.</text>
<line x1="56" y1="296" x2="696" y2="296" stroke="#e7e5e4"/>
<text class="tick" x="48" y="300" text-anchor="end">0.0</text>
<line x1="56" y1="241.5" x2="696" y2="241.5" stroke="#e7e5e4"/>
<text class="tick" x="48" y="245.5" text-anchor="end">4.0</text>
<line x1="56" y1="187" x2="696" y2="187" stroke="#e7e5e4"/>
<text class="tick" x="48" y="191" text-anchor="end">8.0</text>
<line x1="56" y1="132.5" x2="696" y2="132.5" stroke="#e7e5e4"/>
<text class="tick" x="48" y="136.5" text-anchor="end">12.0</text>
<line x1="56" y1="78" x2="696" y2="78" stroke="#e7e5e4"/>
<text class="tick" x="48" y="82" text-anchor="end">16.0</text>

<rect x="320" y="249.675" width="25" height="46.32499999999999" fill="#1d4e89"/>
<rect x="348" y="182.9125" width="25" height="113.0875" fill="#8d99a6"/>
<rect x="376" y="144.76250000000002" width="25" height="151.23749999999998" fill="#c47b3a"/>
<rect x="404" y="117.51250000000002" width="25" height="178.48749999999998" fill="#8c3a4b"/>
<text class="tick" x="376" y="324" text-anchor="middle">All tasks</text>

<rect x="24" y="342" width="12" height="12" rx="2" fill="#1d4e89"/>
<text class="tick" x="42" y="353">CAP</text>
<rect x="174" y="342" width="12" height="12" rx="2" fill="#8d99a6"/>
<text class="tick" x="192" y="353">Fetch, clean</text>
<rect x="324" y="342" width="12" height="12" rx="2" fill="#c47b3a"/>
<text class="tick" x="342" y="353">Fetch, realistic</text>
<rect x="474" y="342" width="12" height="12" rx="2" fill="#8c3a4b"/>
<text class="tick" x="492" y="353">Browser</text>
</svg>
